services:
  backend:
    build:
      context: ./backend/candidex-api
    container_name: candidex-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - candidex-cv-uploads:/app/uploads
    networks:
      - candidex-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend/candidex-frontend
    container_name: candidex-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - candidex-network

volumes:
  candidex-cv-uploads:
    driver: local

networks:
  candidex-network:
    driver: bridge
