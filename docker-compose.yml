services:
  backend:
    build:
      context: ./backend/candidex-api
    container_name: candidex-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    volumes:
      - candidex-cv-uploads:/app/uploads
    networks:
      - candidex-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend/candidex-frontend
    container_name: candidex-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - candidex-network

  caddy:
    image: caddy:2-alpine
    container_name: candidex-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - candidex-network

volumes:
  candidex-cv-uploads:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  candidex-network:
    driver: bridge
