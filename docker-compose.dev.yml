# ================================================================
# Docker Compose — DÉVELOPPEMENT LOCAL uniquement
# But: faire tourner le backend + une base Mongo LOCALE, pendant
# que le frontend tourne en `ng serve` (rechargement instantané).
#
#   docker compose -f docker-compose.dev.yml up -d --build
#   (puis, dans frontend/candidex-frontend : npm start)
#
# NE PAS utiliser en production. Base et secrets = jetables/dev.
# ================================================================
services:
  mongo:
    image: mongo:7
    container_name: candinote-dev-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - candinote-dev-mongo-data:/data/db

  backend:
    build:
      context: ./backend/candidex-api
    container_name: candinote-dev-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Base Mongo LOCALE (le conteneur "mongo" ci-dessus), sans authentification
      MONGODB_URI: mongodb://mongo:27017/candidex
      # Secret JWT factice pour le dev (>= 32 octets) — NE PAS réutiliser en prod
      JWT_SECRET: dev-only-secret-key-min-32-bytes-please-change-me-0123456789
      JWT_EXPIRATION: 86400000
      # Autorise le frontend lancé par `ng serve`
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

volumes:
  candinote-dev-mongo-data:
    driver: local
