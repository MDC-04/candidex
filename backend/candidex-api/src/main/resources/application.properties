# Candidex API - Spring Boot Configuration
# Based on ARCHITECTURE.md and API.md specifications

# Application
spring.application.name=candidex-api
server.port=8080

# MongoDB Configuration (dev: no auth, prod: see application-prod.properties)
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:candidex}

# Logging
logging.level.root=INFO
logging.level.com.candidex.api=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Configuration
# Dev fallback only. In production JWT_SECRET is REQUIRED (see application-prod.properties).
jwt.secret=${JWT_SECRET:candidex-dev-only-secret-key-min-256-bits-do-not-use-in-production-please}
jwt.expiration=${JWT_EXPIRATION:86400000}
# JWT expiration: 86400000 ms = 24 hours

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Error responses (do not leak internals; details are handled by GlobalExceptionHandler)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Jackson (JSON serialization)
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Actuator (only expose health for container healthchecks; never leak internal details)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
