# CandiNote API - Production overrides
# Activated with: --spring.profiles.active=prod
# These properties override application.properties when the "prod" profile is active.

# MongoDB with authentication
spring.data.mongodb.host=${MONGODB_HOST}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:candidex}
spring.data.mongodb.username=${MONGODB_USERNAME}
spring.data.mongodb.password=${MONGODB_PASSWORD}
spring.data.mongodb.authentication-database=${MONGODB_AUTH_DB:admin}

# Logging (less verbose in prod)
logging.level.root=WARN
logging.level.com.candidex.api=INFO

# Security: these secrets are REQUIRED in production (no fallback).
# The application will fail to start if they are not provided as environment variables.
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
