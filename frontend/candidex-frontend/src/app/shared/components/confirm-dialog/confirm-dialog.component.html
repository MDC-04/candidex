<div class="cx-confirm" [class.cx-confirm--warn]="data.confirmColor === 'warn'">

  <div class="cx-confirm__badge">
    <span class="cx-confirm__ring"></span>
    <mat-icon>{{ data.confirmColor === 'warn' ? 'warning' : 'help' }}</mat-icon>
  </div>

  <h2 mat-dialog-title class="cx-confirm__title">{{ data.title }}</h2>

  <mat-dialog-content class="cx-confirm__message">
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="cx-confirm__actions">
    <button mat-button class="cx-confirm__cancel" (click)="onCancel()">
      {{ data.cancelText }}
    </button>
    <button mat-flat-button class="cx-confirm__confirm" (click)="onConfirm()">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>

</div>
